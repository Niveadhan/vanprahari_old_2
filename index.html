<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b4d2e">
<meta name="mobile-web-app-capable" content="yes">
<title>Van Prahari | वन प्रहरी</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#1b4d2e;--g2:#2e7d4f;--g3:#e8f3ec;--bg:#f4f6f3;--tx:#1d2420;--mu:#5d6b62;--bd:#d5ddd7;--rd:#b3261e;--am:#b26a00;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.screen{display:none;min-height:100vh;max-width:620px;margin:0 auto;padding-bottom:40px}
.screen.on{display:block}
.top{position:sticky;top:0;z-index:500;background:var(--g);color:#fff;display:flex;align-items:center;gap:8px;padding:12px 12px;padding-top:max(12px,env(safe-area-inset-top))}
.top h1{font-size:18px;margin:0;flex:1;font-weight:650}
.top .ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;min-width:40px;height:40px;font-size:18px;padding:0 10px}
.wrap{padding:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;color:var(--g)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:transparent}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
@media(max-width:400px){.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:650;padding:13px 16px;min-height:48px;width:100%;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}
.btn.ghost{background:var(--g3);color:var(--g)}
.btn.red{background:var(--rd)}
.btn.amber{background:var(--am)}
.btn.sm{min-height:42px;padding:9px 12px;font-size:15px;width:auto;flex:1}
.row{display:flex;gap:10px;margin-top:10px}
.link{background:none;border:0;color:var(--g2);font-weight:600;padding:12px 0;width:100%;text-align:center;text-decoration:underline}
.hero{background:linear-gradient(160deg,#1b4d2e,#2e7d4f);color:#fff;padding:48px 20px 34px;text-align:center;border-radius:0 0 28px 28px}
.hero img{width:84px;height:84px;border-radius:22px;background:#fff2}
.hero h2{margin:10px 0 2px;font-size:26px}
.hero p{margin:0;opacity:.85}
.lang{position:absolute;top:14px;right:14px;background:#ffffff26;border:0;color:#fff;border-radius:20px;padding:6px 14px;font-weight:650}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:18px 12px;text-align:center;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:650;color:var(--g);cursor:pointer}
.tile .ic{font-size:34px;line-height:1}
.tile.wide{grid-column:1/-1;flex-direction:row;min-height:70px}
.who{display:flex;gap:12px;align-items:center}
.who .av{width:46px;height:46px;border-radius:50%;background:var(--g3);color:var(--g);display:grid;place-items:center;font-weight:700;font-size:18px}
.who b{display:block}
.who small{color:var(--mu)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;padding:5px 10px;border-radius:20px;background:var(--g3);color:var(--g);font-weight:600;border:0}
.chip.off{background:#fde8e6;color:var(--rd)}
.chip.pend{background:#fff1dc;color:var(--am)}
.banner{background:#fff1dc;color:#6b4300;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.pbox .prow{display:flex;gap:8px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;background:#ddd}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px;line-height:1}
.thumb.busy{display:grid;place-items:center;font-size:12px;color:var(--mu)}
.map{height:52vh;min-height:300px;border-radius:var(--r);border:1px solid var(--bd);z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--g)}
.stat small{font-size:11px;color:var(--mu)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #eef1ee}
.list .it:last-child{border-bottom:0}
.list .it small{color:var(--mu);display:block}
.st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:12px;background:#fff1dc;color:var(--am);white-space:nowrap}
.st.ok{background:var(--g3);color:var(--g)}
.st.err{background:#fde8e6;color:var(--rd)}
.ins h3{display:flex;justify-content:space-between;align-items:center}
.ins .req{font-size:12px;color:var(--rd);font-weight:600}
.ins.done{border-color:var(--g2)}
.ins.done .req{color:var(--g2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#1d2420;color:#fff;padding:12px 18px;border-radius:12px;z-index:3000;max-width:90vw;transition:transform .25s;font-size:15px;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.ov{position:fixed;inset:0;background:#0009;z-index:2000;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin:0 0 6px;color:var(--g)}
#viewer{align-items:center;background:#000e}
#viewer img{max-width:100%;max-height:100%}
#busy{align-items:center;z-index:2500}
#busy div{background:#fff;padding:18px 22px;border-radius:14px;font-weight:600}
.muted{color:var(--mu);font-size:14px}
.gpsline{font-size:13px;color:var(--mu);margin-top:6px}
.rec{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff5a4f;margin-right:6px;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.center{text-align:center}
.hide{display:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1.5px solid var(--bd);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer}
.seg button b{display:block;color:var(--g);font-size:15px}
.seg button small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.seg button.on{border-color:var(--g);background:var(--g3);box-shadow:inset 0 0 0 1px var(--g)}
.rolechip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--g3);color:var(--g);margin-left:6px;vertical-align:1px}
.hqbox{border-radius:14px;padding:14px;border:2px solid var(--bd);background:#fff;margin-bottom:12px}
.hqbox.in{border-color:#2e7d32;background:#eaf6ec}
.hqbox.out{border-color:var(--rd);background:#fdecea;animation:pulse 1.6s ease-in-out 2}
.hqbox.warn{border-color:var(--am);background:#fff4e0}
.hqbox h3{margin:0 0 4px;font-size:17px}
.hqbox.in h3{color:#1b5e20}.hqbox.out h3{color:var(--rd)}.hqbox.warn h3{color:#7a4a00}
.hqbox .big{font-size:22px;font-weight:800;margin:2px 0 6px}
.opt{display:flex;gap:8px;margin:10px 0 2px}
.opt label{flex:1;margin:0;display:flex;align-items:center;gap:8px;border:1.5px solid var(--bd);background:#fff;border-radius:12px;padding:12px;font-size:15px;color:var(--tx);cursor:pointer}
.opt input{width:auto;margin:0}
.opt label:has(input:checked){border-color:var(--g);background:var(--g3)}
@keyframes pulse{50%{box-shadow:0 0 0 6px #b3261e33}}
@media(prefers-reduced-motion:reduce){.hqbox.out{animation:none}}
.gmap{height:46vh;min-height:260px;border-bottom:1px solid var(--bd);z-index:1}
.gtools{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding:6px;background:#fff;border-bottom:1px solid var(--bd)}
.gtools button{border:0;background:none;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:54px}
.gtools button span{font-size:20px;line-height:1.1}
.gtools small{font-size:11px;color:var(--mu);font-weight:650;white-space:nowrap}
.gtools button.on{background:var(--g3)}
.gtools button.on small{color:var(--g)}
.gpanel{padding:12px 14px 30px}
.gpanel h4{margin:14px 0 6px;color:var(--g)}
.menu{position:fixed;right:8px;top:62px;width:min(340px,calc(100vw - 16px));background:#fff;border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px #0003;z-index:1500;padding:14px;max-height:75vh;overflow:auto}
.lyr{border:1px solid var(--bd);border-radius:12px;background:#fff;margin-bottom:8px}
.lyr .lh{display:flex;align-items:center;gap:6px;padding:8px}
.lyr .lh input[type=text]{flex:1;min-width:0;padding:7px 8px;border:1px solid transparent;font-weight:650;background:transparent}
.lyr .lh input[type=text]:focus,.fe input[type=text]:focus{border-color:var(--bd);background:#fff;outline:2px solid var(--g2)}
.lyr input[type=checkbox],.fe input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--g);margin:0}
.lyr input[type=color]{width:36px;height:32px;padding:0;border:1px solid var(--bd);border-radius:8px;flex:none;background:#fff}
.lyr .lo{display:flex;align-items:center;gap:8px;padding:0 10px 8px 44px;font-size:13px;color:var(--mu)}
.lyr .lo input[type=range]{flex:1;padding:0;accent-color:var(--g)}
.lyr .lo b{min-width:40px;text-align:right;color:var(--tx);font-variant-numeric:tabular-nums}
.lyr .feats{border-top:1px solid #eef1ee;padding:4px 8px 8px 36px}
.fe{display:flex;align-items:center;gap:6px;padding:3px 0}
.fe input[type=text]{flex:1;min-width:0;padding:6px 8px;font-size:14px;border:1px solid transparent;background:transparent}
.mini{border:0;background:var(--g3);color:var(--g);border-radius:8px;min-width:34px;height:34px;font-size:15px;cursor:pointer;flex:none}
.mini.red{background:#fde8e6;color:var(--rd)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:15px}
.kv b{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv span{color:var(--mu)}
.rose{display:block;margin:4px auto;width:min(250px,68vw);height:auto}
.heading{text-align:center;font-size:36px;font-weight:800;color:var(--g);font-variant-numeric:tabular-nums}
.prof{position:relative;margin-top:6px}
.prof svg{display:block;width:100%;height:180px;touch-action:none}
.ptip{position:absolute;top:4px;right:6px;background:#1d2420;color:#fff;font-size:12px;padding:4px 8px;border-radius:8px;pointer-events:none}
.pill{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.pill button{border:0;background:#fff;padding:8px 14px;cursor:pointer;font-weight:650}
.pill button.on{background:var(--g);color:#fff}
.exp-it{display:flex;align-items:center;gap:10px;padding:8px 0;margin:0;font-size:15px;color:var(--tx);font-weight:500;border-bottom:1px solid #f0f2f0}
.exp-it input{width:20px;height:20px;margin:0;accent-color:var(--g)}
.drawhint{background:#fff4e0;border-radius:10px;padding:9px 11px;font-size:14px;color:#6b4300;margin-bottom:10px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="screen" id="s-login">
  <div class="hero" style="position:relative">
    <button class="lang" onclick="toggleLang()">EN / हिं</button>
    <img src="icons/icon-192.png" alt="">
    <h2 data-i18n="appName">Van Prahari</h2>
    <p data-i18n="tagline"></p>
  </div>
  <div class="wrap">
    <div id="demoBanner1" class="banner hide" data-i18n="demoLogin"></div>
    <div class="seg" id="portal">
      <button type="button" data-p="field" class="on"><b data-i18n="pField"></b><small data-i18n="pFieldSub"></small></button>
      <button type="button" data-p="officer"><b data-i18n="pOfficer"></b><small data-i18n="pOfficerSub"></small></button>
    </div>
    <div class="card">
      <label data-i18n="empOrMobile"></label>
      <input id="lg-id" autocomplete="username" inputmode="text">
      <label data-i18n="password"></label>
      <input id="lg-pw" type="password" autocomplete="current-password">
      <div class="row" style="margin-top:6px"><label style="display:flex;gap:8px;align-items:center;margin:0;font-weight:500"><input type="checkbox" id="lg-show" style="width:auto"> <span data-i18n="showPw"></span></label></div>
      <div class="row"><button class="btn" id="lg-btn" onclick="doLogin()" data-i18n="login"></button></div>
      <button class="link" onclick="openOtp()" data-i18n="forgot"></button>
    </div>
  </div>
</section>

<!-- ============ OTP / SET PASSWORD ============ -->
<section class="screen" id="s-otp">
  <div class="top"><button class="ib" onclick="goBack()">←</button><h1 data-i18n="setPwTitle"></h1></div>
  <div class="wrap">
    <div class="card" id="otp1">
      <p class="muted" data-i18n="otpHelp"></p>
      <label data-i18n="empOrMobile"></label>
      <input id="ot-id">
      <div class="row"><button class="btn" id="ot-send" onclick="sendOtp()" data-i18n="sendOtp"></button></div>
    </div>
    <div class="card hide" id="otp2">
      <p class="muted" id="ot-sent"></p>
      <label data-i18n="otp"></label>
      <input id="ot-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <label data-i18n="newPw"></label>
      <input id="ot-pw" type="password" autocomplete="new-password">
      <label data-i18n="confirmPw"></label>
      <input id="ot-pw2" type="password" autocomplete="new-password">
      <p class="muted" data-i18n="pwRule"></p>
      <div class="row"><button class="btn" id="ot-set" onclick="resetPw()" data-i18n="setPw"></button></div>
      <button class="link" id="ot-resend" onclick="sendOtp(true)" disabled></button>
    </div>
  </div>
</section>

<!-- ============ HOME ============ -->
<section class="screen" id="s-home">
  <div class="top"><h1 data-i18n="appName"></h1><button class="ib" onclick="toggleLang()">EN/हिं</button><button class="ib" onclick="openSettings()">⚙</button></div>
  <div class="wrap">
    <div id="demoBanner2" class="banner hide" data-i18n="demo"></div>
    <div class="card">
      <div class="who"><div class="av" id="h-av"></div><div><b id="h-name"></b><small id="h-sub"></small></div></div>
      <div class="chips"><span class="chip" id="h-net"></span><button class="chip pend" id="h-pend" onclick="trySync(true)"></button></div>
    </div>
    <div class="tiles">
      <div class="tile" data-r="field" onclick="openPatrol()"><span class="ic">🧭</span><span data-i18n="patrol"></span></div>
      <div class="tile" data-r="field" onclick="openInspect()"><span class="ic">🌳</span><span data-i18n="inspect"></span></div>
      <div class="tile" data-r="field" onclick="openAttend()"><span class="ic">📍</span><span data-i18n="attend"></span></div>
      <div class="tile" data-r="field" onclick="openWorks()"><span class="ic">🛠️</span><span data-i18n="works"></span></div>
      <div class="tile" data-r="field" onclick="openPhotos()"><span class="ic">📷</span><span data-i18n="photos"></span></div>
      <div class="tile" data-r="all" onclick="openGis()"><span class="ic">🗺️</span><span data-i18n="gis"></span></div>
      <div class="tile wide" data-r="dash" onclick="openDash()"><span class="ic">📊</span><span data-i18n="dashboard"></span></div>
    </div>
    <div id="h-active" class="banner hide" style="margin-top:12px" onclick="show('s-patrol-active')"></div>
  </div>
</section>

<!-- ============ PATROL LIST ============ -->
<section class="screen" id="s-patrol">
  <div class="top"><button class="ib" onclick="goBack()">←</button><h1 data-i18n="patrol"></h1></div>
  <div class="wrap">
    <button class="btn" onclick="openPatrolStart()">▶ <span data-i18n="startPatrol"></span></button>
    <div class="card" style="margin-top:12px"><h3 data-i18n="pastPatrols"></h3><div class="list" id="pt-list"></div></div>
  </div>
</section>

<!-- ============ PATROL START ============ -->
<section class="screen" id="s-patrol-start">
  <div class="top"><button class="ib" onclick="goBack()">←</button><h1 data-i18n="startPatrol"></h1></div>
  <div class="wrap">
    <div class="card">
      <label data-i18n="patrolType"></label><select id="ps-type"></select>
      <div id="ps-loc"></div>
      <label data-i18n="team"></label><input id="ps-team">
      <label data-i18n="purpose"></label><input id="ps-purpose">
      <p class="muted" data-i18n="patrolTip"></p>
      <div class="row"><button class="btn" onclick="startPatrol()">▶ <span data-i18n="start"></span></button></div>
    </div>
  </div>
</section>

<!-- ============ PATROL ACTIVE ============ -->
<section class="screen" id="s-patrol-active">
  <div class="top"><h1><span class="rec" id="pa-rec"></span><span data-i18n="patrolOn"></span></h1><button class="ib" id="pa-layer" onclick="cycleLayer('active')">🗺</button></div>
  <div class="wrap">
    <div id="pa-map" class="map"></div>
    <div class="stats">
      <div class="stat"><b id="pa-dist">0.00</b><small data-i18n="distKm"></small></div>
      <div class="stat"><b id="pa-time">00:00</b><small data-i18n="duration"></small></div>
      <div class="stat"><b id="pa-pts">0</b><small data-i18n="points"></small></div>
      <div class="stat"><b id="pa-acc">–</b><small data-i18n="accuracy"></small></div>
    </div>
    <div class="gpsline" id="pa-gps"></div>
    <div class="row"><button class="btn amber" onclick="openObs()">＋ <span data-i18n="addObs"></span></button></div>
    <div class="row">
      <button class="btn ghost sm" id="pa-pause" onclick="togglePause()"></button>
      <button class="btn ghost sm" onclick="centerMe()">◎ <span data-i18n="center"></span></button>
      <button class="btn red sm" onclick="stopPatrol()">■ <span data-i18n="stop"></span></button>
    </div>
    <div class="card" style="margin-top:12px"><h3 data-i18n="observations"></h3><div class="list" id="pa-obs"></div></div>
  </div>
</section>

<!-- ============ PATROL VIEW ============ -->
<section class="screen" id="s-patrol-view">
  <div class="top"><button class="ib" onclick="goBack()">←</button><h1 id="pv-title"></h1><button class="ib" onclick="cycleLayer('view')">🗺</button></div>
  <div class="wrap">
    <div id="pv-map" class="map"></div>
    <div class="card" style="margin-top:12px" id="pv-info"></div>
    <div class="row"><button class="btn ghost" onclick="downloadKml()">⬇ <span data-i18n="exportKml"></span></button></div>
    <div class="row"><a class="btn ghost" id="pv-gmaps" target="_blank" rel="noopener" style="text-decoration:none">📍 <span data-i18n="openGmaps"></span></a></div>
  </div>
</section>

<!-- ============ BEAT INSPECTION ============ -->
<section class="screen" id="s-inspect">
  <div class="top"><button class="ib" onclick="goBack()">←</button><h1 data-i18n="inspect"></h1></div>
  <div class="wrap">
    <div class="card"><div id="in-loc"></div><label data-i18n="date"></label><input id="in-date" type="date"></div>
    <div id="in-items"></div>
    <div class="card"><label data-i18n="remarksAll"></label><textarea id="in-rem"></textarea></div>
    <button class="btn" onclick="submitInspect()" data-i18n="submit"></button>
  </div>
</section>

<!-- ============ ATTENDANCE ============ -->
<section class="screen" id="s-attend">
  <div class="top"><button class="ib" onclick="goBack()">←</button><h1 data-i18n="attend"></h1></div>
  <div class="wrap">
    <div id="at-hq" class="hqbox"></div>
    <div class="card">
      <label data-i18n="attType"></label><select id="at-type"></select>
      <div id="at-loc"></div>
      <label data-i18n="teep"></label><textarea id="at-teep" rows="3"></textarea>
      <p class="muted" data-i18n="teepHelp"></p>
    </div>
    <div class="card"><h3 data-i18n="attPhoto"></h3><div id="at-photos"></div><p class="muted" data-i18n="stampHelp"></p></div>

/* ---------------- storage (IndexedDB) ---------------- */
const idb = (() => {
  let dbp; const KP = { outbox: 'uid', patrols: 'id', log: 'uid' };
  const mem = { outbox: new Map(), patrols: new Map(), kv: new Map(), log: new Map() };   // fallback if the browser blocks storage
  function open() {
    return dbp || (dbp = new Promise(res => {
      try {
        const r = indexedDB.open('vanprahari', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('outbox', { keyPath: 'uid' }); d.createObjectStore('patrols', { keyPath: 'id' }); d.createObjectStore('kv'); d.createObjectStore('log', { keyPath: 'uid' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch (e) { res(null); }
    }));
  }
  async function rq(store, mode, op, memOp) {
    const d = await open();
    if (!d) return memOp(mem[store]);
    return new Promise((res, rej) => { const r = op(d.transaction(store, mode).objectStore(store)); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  return {
    put: (s, v, k) => rq(s, 'readwrite', o => k === undefined ? o.put(v) : o.put(v, k), m => { m.set(k !== undefined ? k : v[KP[s]], clone(v)); }),
    get: (s, k) => rq(s, 'readonly', o => o.get(k), m => clone(m.get(k))),
    del: (s, k) => rq(s, 'readwrite', o => o.delete(k), m => { m.delete(k); }),
    all: s => rq(s, 'readonly', o => o.getAll(), m => [...m.values()].map(clone)),
    count: s => rq(s, 'readonly', o => o.count(), m => m.size)
  };
})();

function apiUrl() { return (LS.get('api', '') || CONFIG.API_URL || '').trim(); }
async function api(action, body) {
  const url = apiUrl(); if (!url) throw new Error('DEMO');
  let r;
  try { r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, body)) }); }
  catch (e) { throw new Error(t('needNet')); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('Server error (' + r.status + ')'); }
  if (!j.ok) { const er = new Error(j.error || 'Error'); er.code = j.code; throw er; }
  return j;
}

const stack = [];

function show(id, push = true) {

  $$('.screen').forEach(s => s.classList.toggle('on', s.id === id));

  if (ONSHOW[id]) ONSHOW[id]();
}
window.addEventListener('popstate', () => {

  if ($('#obs-ov').classList.contains('on')) { closeObs(); hpush({}, ''); return; }
  if (cur === 's-patrol-active' || stack.length <= 1 || cur === 's-home' || cur === 's-login') {
    hpush({}, '');
    if (cur === 's-patrol-active') toast(t('endFirst'));
    return;
  }
  stack.pop(); show(stack[stack.length - 1], false);
});
function resetTo(id) { stack.length = 0; show(id); }
function hpush(st) { if (!window.VP_PREVIEW) try { history.pushState(st, ''); } catch (e) {} }

  const cur = stack[stack.length - 1];

  const r = $('.r', el), c = $('.c', el), b = $('.b', el);
  const uniq = a => [...new Set(a)].filter(Boolean);
  const opt = (arr) => `<option value="">${esc(t('select'))}</option>` + arr.map(x => `<option>${esc(x)}</option>`).join('');
  r.innerHTML = opt(uniq(M.map(x => x.range)));
  const fillC = () => { c.innerHTML = opt(uniq(M.filter(x => x.range === r.value).map(x => x.circle))); };
  const fillB = () => { b.innerHTML = opt(uniq(M.filter(x => x.range === r.value && x.circle === c.value).map(x => x.beat))); };
  r.onchange = () => { fillC(); fillB(); onChange && onChange(); };
  c.onchange = () => { fillB(); onChange && onChange(); };
  b.onchange = () => onChange && onChange();
  const u = user(); const last = LS.get('lastLoc', {});
  const pre = (u.range ? u : last);
  if (pre.range) { r.value = pre.range; fillC(); c.value = pre.circle || ''; fillB(); b.value = pre.beat || ''; } else { fillC(); fillB(); }
  return {
    get: () => ({ range: r.value, circle: c.value, beat: b.value }),
    valid: () => !!(r.value && c.value && b.value),
    remember() { LS.set('lastLoc', this.get()); }
  };
}

/* ---------------- GPS ---------------- */
let lastFix = null;
function getPos(timeout = 25000) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error(t('gpsFail')));
    navigator.geolocation.getCurrentPosition(p => { lastFix = p; res(p); }, e => {
      if (lastFix && Date.now() - lastFix.timestamp < 180000) res(lastFix); else rej(new Error(t('gpsFail')));
    }, { enableHighAccuracy: true, timeout, maximumAge: 10000 });
  });
}

async function loadBitmap(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {} }
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Cannot read image')); i.src = URL.createObjectURL(file); });
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
async function stampPhoto(file, m, teep) {
  const img = await loadBitmap(file);
  const MAX = 1600; let w = img.width, h = img.height; const s = Math.min(1, MAX / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d');
  x.drawImage(img, 0, 0, w, h);
  const fs = Math.max(13, Math.round(Math.min(w, h) * 0.03)); const lh = Math.round(fs * 1.32); const pd = Math.round(fs * 0.6);
  x.font = `600 ${fs}px system-ui, "Noto Sans Devanagari", "Noto Sans", sans-serif`;
  const d = m.time instanceof Date ? m.time : new Date(m.time);
  const lines = [];
  lines.push(m.lat != null ? `Lat: ${m.lat.toFixed(6)}°   Long: ${m.lng.toFixed(6)}°` : 'GPS: not available');
  lines.push(`Date: ${fmtDate(d)}   Time: ${fmtTime(d)}`);
  lines.push(`Elevation: ${m.alt != null ? Math.round(m.alt) + ' m' : '—'}` + (m.acc != null ? `   Accuracy: ±${Math.round(m.acc)} m` : ''));
  const maxW = w * 0.86;
  if (teep) wrapText(x, 'टीप: ' + teep, maxW).slice(0, 4).forEach(l => lines.push(l));
  const u = user(); lines.push(`${CONFIG.APP} • ${u.name || ''}${u.empId ? ' (' + u.empId + ')' : ''}`);
  const bw = Math.min(w - pd, Math.max(...lines.map(l => x.measureText(l).width)) + pd * 2);
  const bh = lines.length * lh + pd * 1.4;
  const bx = Math.round(pd * 0.6), by = Math.round(h - bh - pd * 0.6);
  x.fillStyle = 'rgba(0,0,0,0.58)'; x.fillRect(bx, by, bw, bh);
  x.fillStyle = '#ffd54f'; x.fillRect(bx, by, Math.max(3, fs * 0.2), bh);
  x.textBaseline = 'top';
  lines.forEach((l, i) => { x.fillStyle = i === lines.length - 1 ? '#c8e6c9' : '#fff'; x.fillText(l, bx + pd, by + pd * 0.7 + i * lh); });
  const ts = Math.min(1, 360 / Math.max(w, h)), tc = document.createElement('canvas');
  tc.width = Math.round(w * ts); tc.height = Math.round(h * ts); tc.getContext('2d').drawImage(cv, 0, 0, tc.width, tc.height);
  return { data: cv.toDataURL('image/jpeg', 0.82), thumb: tc.toDataURL('image/jpeg', 0.7) };
}
async function processPhoto(file, src, teep) {
  let meta = null, exTime = null;
  if (src === 'gallery' && window.exifr) {
    try {
      const ex = await exifr.parse(file);
      if (ex) {
        exTime = ex.DateTimeOriginal || ex.CreateDate || ex.ModifyDate || null;
        if (ex.latitude != null && ex.longitude != null) meta = { lat: ex.latitude, lng: ex.longitude, alt: ex.GPSAltitude ?? null, acc: null, time: exTime ? new Date(exTime) : new Date(file.lastModified), gpsFrom: 'photo' };
      }
    } catch (e) {}
  }
  if (!meta) {
    let p = null; try { p = await getPos(); } catch (e) { toast(e.message); }
    const tm = src === 'gallery' ? (exTime ? new Date(exTime) : new Date(file.lastModified || Date.now())) : new Date();
    meta = p ? { lat: p.coords.latitude, lng: p.coords.longitude, alt: p.coords.altitude, acc: p.coords.accuracy, time: tm, gpsFrom: 'device' } : { lat: null, lng: null, alt: null, acc: null, time: tm, gpsFrom: 'none' };
  }
  const { data, thumb } = await stampPhoto(file, meta, teep);
  return { data, thumb, lat: meta.lat, lng: meta.lng, alt: meta.alt, acc: meta.acc, time: new Date(meta.time).toISOString(), src, gpsFrom: meta.gpsFrom, teep };
}
function photoBox(el, opt = {}) {
  const st = { list: [] };
  el.className = 'pbox';
  el.innerHTML = `<div class="prow"><button type="button" class="btn sm cam">📷 ${esc(t('camera'))}</button><button type="button" class="btn sm ghost gal">🖼 ${esc(t('gallery'))}</button></div><div class="thumbs"></div>
    <input type="file" accept="image/*" capture="environment" class="fcam hide"><input type="file" accept="image/*" ${opt.single ? '' : 'multiple'} class="fgal hide">`;
  const th = $('.thumbs', el);
  $('.cam', el).onclick = () => { if (opt.before && !opt.before()) return; $('.fcam', el).click(); };
  $('.gal', el).onclick = () => { if (opt.before && !opt.before()) return; $('.fgal', el).click(); };
  async function handle(files, src) {
    for (const f of files) {
      const b = document.createElement('div'); b.className = 'thumb busy'; b.textContent = '…'; th.appendChild(b);
      try { const p = await processPhoto(f, src, opt.teep ? opt.teep() : ''); if (opt.accept && !opt.accept(p)) continue; if (opt.single) st.list = []; st.list.push(p); }
      catch (e) { toast(e.message); }
      finally { b.remove(); draw(); opt.onChange && opt.onChange(); }
    }
  }
  $('.fcam', el).onchange = e => { handle([...e.target.files], 'camera'); e.target.value = ''; };
  $('.fgal', el).onchange = e => { handle([...e.target.files], 'gallery'); e.target.value = ''; };

    th.querySelectorAll('.thumb:not(.busy)').forEach(n => n.remove());
    st.list.forEach((p, i) => {

      d.innerHTML = `<img src="${p.data}" alt=""><button type="button">×</button>`;
      d.querySelector('button').onclick = () => { st.list.splice(i, 1); draw(); opt.onChange && opt.onChange(); };
      d.querySelector('img').onclick = () => viewImg(p.data);

}

async function enqueue(rec, title) {

  await idb.put('log', { uid: rec.uid, kind: rec.kind, title, at: Date.now(), status: 'pending' });
  updateBadge(); toast(t('saved')); trySync();

let syncing = false;
async function trySync(manual) {
  if (syncing) return;
  if (!apiUrl()) { if (manual) toast(t('demo')); return; }
  if (!navigator.onLine) { if (manual) toast(t('offlineNow')); return; }
  if (!session || session.token === 'demo') return;
  syncing = true; updateBadge(); let ok = 0;
  try {
    const items = (await idb.all('outbox')).sort((a, b) => a.capturedAt < b.capturedAt ? -1 : 1);
    for (const it of items) {
      try {
        await api('submit', { token: session.token, record: it });
        await idb.del('outbox', it.uid);
        const lg = await idb.get('log', it.uid); if (lg) { lg.status = 'ok'; lg.err = ''; await idb.put('log', lg); }
        if (it.kind === 'patrol') { const p = await idb.get('patrols', it.uid); if (p) { p.synced = true; (p.obs || []).forEach(o => o.photos = (o.photos || []).map(x => Object.assign({}, x, { data: '', thumb: '' }))); await idb.put('patrols', p); } }
        ok++;
      } catch (e) {
        if (e.code === 'AUTH') { toast(t('sessionExpired'), 5000); session = null; LS.del('session'); resetTo('s-login'); break; }
        const lg = await idb.get('log', it.uid); if (lg) { lg.status = 'err'; lg.err = e.message; await idb.put('log', lg); }
        if (e.message === t('needNet')) break;
      }
    }
  } finally { syncing = false; updateBadge(); if (stack[stack.length - 1] === 's-settings') renderSettings(); }
  if (ok) toast(ok + ' ' + t('uploaded'));
}
async function updateBadge() {

  net.textContent = navigator.onLine ? t('online') : t('offline'); net.classList.toggle('off', !navigator.onLine);
  let n = 0; try { n = await idb.count('outbox'); } catch (e) {}
  const pe = $('#h-pend'); pe.textContent = syncing ? t('syncing') : (n ? `⬆ ${n} ${t('pending')}` : t('allSynced'));
  pe.className = 'chip' + (n ? ' pend' : '');
}

let P = null, watchId = null, wakeLock = null, maps = {}, tickTimer = null, persistAt = 0;
function makeMap(elId, key) {
  if (maps[key]) { maps[key].map.remove(); }

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' }),
    L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, subdomains: 'abc', attribution: '© OpenTopoMap' })
  ];
  const li = LS.get('layer', 0) % layers.length;
  const map = L.map(elId, { zoomControl: true }).setView([21.9, 77.9], 12);
  layers[li].addTo(map);

}
function cycleLayer(key) { const m = maps[key]; if (!m) return; m.map.removeLayer(m.layers[m.li]); m.li = (m.li + 1) % m.layers.length; m.layers[m.li].addTo(m.map); LS.set('layer', m.li); }

function onPos(pos) {

}

/* Compass */

function roseSvg() {

    ticks += `<line x1="${(Math.sin(rad) * r1).toFixed(1)}" y1="${(-Math.cos(rad) * r1).toFixed(1)}" x2="${(Math.sin(rad) * 96).toFixed(1)}" y2="${(-Math.cos(rad) * 96).toFixed(1)}" stroke="${long ? '#1d2420' : '#8a968e'}" stroke-width="${long ? 2 : 1}"/>`;
    if (long && a % 90) ticks += `<text x="${(Math.sin(rad) * 68).toFixed(1)}" y="${(-Math.cos(rad) * 68 + 4).toFixed(1)}" text-anchor="middle" font-size="11" fill="#5d6b62">${a}</text>`; }
  const L = (txt, a, col) => { const rad = a * Math.PI / 180; return `<text x="${(Math.sin(rad) * 62).toFixed(1)}" y="${(-Math.cos(rad) * 62 + 8).toFixed(1)}" text-anchor="middle" font-size="24" font-weight="800" fill="${col}">${txt}</text>`; };

  const yt = [mn, (mn + mx) / 2, mx].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#e7e7e7"/><text x="${m.l - 6}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#666">${Math.round(v)}</text>`).join('');
  const xt = [0, .5, 1].map(fr => `<text x="${X(Lm * fr).toFixed(1)}" y="${H - 6}" text-anchor="${fr === 0 ? 'start' : fr === 1 ? 'end' : 'middle'}" font-size="11" fill="#666">${fmtLen(Lm * fr)}</text>`).join('');
  s.setAttribute('viewBox', `0 0 ${W} ${H}`);
  s.innerHTML = `${yt}<path d="${line}L${X(Lm).toFixed(1)},${H - m.b}L${m.l},${H - m.b}Z" fill="#2e7d4f22"/><path d="${line}" fill="none" stroke="#2e7d4f" stroke-width="2"/>${xt}
    <line id="pcur" y1="${m.t}" y2="${H - m.b}" stroke="#1d2420" stroke-dasharray="3 3" visibility="hidden"/><circle id="pdot" r="4" fill="#ff6f00" stroke="#fff" stroke-width="2" visibility="hidden"/>`;
  const tip = $('#ptip');
  const mv = ev => {
    const r = s.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * W, d = Math.max(0, Math.min(Lm, (x - m.l) / (W - m.l - m.r) * Lm));
    let k = 0; for (let i = 1; i < P.length; i++) if (Math.abs(P[i][0] - d) < Math.abs(P[k][0] - d)) k = i;
    const p = P[k];
    $('#pcur').setAttribute('x1', X(p[0])); $('#pcur').setAttribute('x2', X(p[0])); $('#pcur').setAttribute('visibility', 'visible');
    $('#pdot').setAttribute('cx', X(p[0])); $('#pdot').setAttribute('cy', Y(p[1])); $('#pdot').setAttribute('visibility', 'visible');
    tip.textContent = `${fmtLen(p[0])} · ${Math.round(p[1])} m`; tip.classList.remove('hide');
    if (G.map) { if (!G.profMk) G.profMk = L.circleMarker([p[2], p[3]], { radius: 7, color: '#fff', weight: 2, fillColor: '#ff6f00', fillOpacity: 1, interactive: false }).addTo(G.map); else G.profMk.setLatLng([p[2], p[3]]); }
  };
  s.addEventListener('pointermove', mv); s.addEventListener('pointerdown', mv);
}

/* ---- KML / KMZ import ---- */
$('#gis-file').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; let added = [];
  for (const file of files) {
    try { const l = await readGeoFile(file); G.layers.push(l); renderLayer(l); added.push(l); toast('✓ ' + file.name); }
    catch (x) { toast(file.name + ': ' + x.message, 4500); }
  }
  if (added.length) { saveGis(); zoomTo(gisBounds(added)); openLayers(); }
};
async function readGeoFile(file) {
  let text;
  if (/\.kmz$/i.test(file.name) || /kmz/.test(file.type)) {
    if (!window.JSZip) throw new Error(t('gKmzNet'));
    const z = await JSZip.loadAsync(file); const k = Object.keys(z.files).find(n => /\.kml$/i.test(n));
    if (!k) throw new Error('No KML inside KMZ'); text = await z.files[k].async('string');
  } else text = await file.text();
  return parseKml(text, file.name.replace(/\.(kml|kmz|xml)$/i, ''));
}
function kChild(el, tag) { for (const c of el.children) if (c.localName === tag) return c.textContent; return ''; }
function parseKml(text, fname) {
  const doc = new DOMParser().parseFromString(text, 'text/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error(t('gBadKml'));
  const byTag = (el, tag) => [...el.getElementsByTagNameNS('*', tag)];
  const kcol = s => { s = (s || '').trim(); return /^[0-9a-f]{8}$/i.test(s) ? '#' + s.slice(6, 8) + s.slice(4, 6) + s.slice(2, 4) : null; };
  const stColor = st => { for (const tg of ['LineStyle', 'PolyStyle', 'IconStyle']) { const e = byTag(st, tg)[0]; const c = e && byTag(e, 'color')[0]; if (c && kcol(c.textContent)) return kcol(c.textContent); } return null; };
  const styles = {};
  byTag(doc, 'Style').forEach(st => { const id = st.getAttribute('id'); if (id) styles['#' + id] = stColor(st); });
  byTag(doc, 'StyleMap').forEach(sm => { const id = sm.getAttribute('id'); const pair = byTag(sm, 'Pair').find(p => (byTag(p, 'key')[0] || {}).textContent === 'normal'); const u = pair && byTag(pair, 'styleUrl')[0]; if (id && u) styles['#' + id] = styles[u.textContent.trim()] || null; });
  const crd = el => el ? el.textContent.trim().split(/\s+/).map(s => s.split(',').map(Number)).filter(a => a.length >= 2 && !isNaN(a[0]) && !isNaN(a[1]))
    .map(a => [+a[1].toFixed(7), +a[0].toFixed(7), a.length > 2 && !isNaN(a[2]) && a[2] !== 0 ? a[2] : null]) : [];
  const feats = [];
  byTag(doc, 'Placemark').forEach(pm => {
    const nm = kChild(pm, 'name').trim(); const su = byTag(pm, 'styleUrl')[0]; const ist = byTag(pm, 'Style')[0];
    const color = (ist && stColor(ist)) || (su ? styles[su.textContent.trim()] : null) || null;
    const push = (type, data) => feats.push(Object.assign({ id: gid(), name: nm || type, type, visible: true, color }, data));
    byTag(pm, 'Point').forEach(p => { const c = crd(byTag(p, 'coordinates')[0]); if (c.length) push('Point', { coords: [c[0]] }); });
    byTag(pm, 'LineString').forEach(ls => { const c = crd(byTag(ls, 'coordinates')[0]); if (c.length > 1) push('LineString', { coords: c }); });
    byTag(pm, 'Polygon').forEach(pg => {
      const rings = [];
      byTag(pg, 'outerBoundaryIs').forEach(b => rings.push(crd(byTag(b, 'coordinates')[0])));
      byTag(pg, 'innerBoundaryIs').forEach(b => rings.push(crd(byTag(b, 'coordinates')[0])));
      const rr = rings.filter(r => r.length > 2).map(r => (r.length > 3 && r[0][0] === r[r.length - 1][0] && r[0][1] === r[r.length - 1][1]) ? r.slice(0, -1) : r);
      if (rr.length) push('Polygon', { rings: rr });
    });
    const gx = byTag(pm, 'coord'); if (gx.length > 1) push('LineString', { coords: gx.map(e => e.textContent.trim().split(/\s+/).map(Number)).map(a => [a[1], a[0], a[2] || null]) });
  });
  if (!feats.length) throw new Error(t('gEmptyKml'));
  const dn = byTag(doc, 'Document')[0], lname = ((dn && kChild(dn, 'name')) || fname).trim() || fname;
  const own = feats.find(f => f.color);
  return { id: gid(), name: lname, file: fname, source: 'kml', visible: true, color: own ? own.color : PALETTE[G.layers.length % PALETTE.length], opacity: 100, open: false, keepOwn: !!own, features: feats };
}

/* ---- Layers panel (like Google Earth "Places") ---- */
function openLayers() { $('#gis-exp').classList.add('hide'); renderLayers(); $('#gis-lyr').classList.add('on'); }
function closeLayers() { $('#gis-lyr').classList.remove('on'); }
const FICON = { Point: '📌', LineString: '〰️', Polygon: '⬠' };
function renderLayers() {
  const box = $('#gis-lyr-list');
  if (!G.layers.length) { box.innerHTML = `<p class="muted">${esc(t('gNoLayers'))}</p>`; return; }
  box.innerHTML = G.layers.map(l => `<div class="lyr" data-l="${l.id}">
    <div class="lh"><button class="mini" data-a="open" aria-label="expand">${l.open ? '▾' : '▸'}</button><input type="checkbox" data-a="vis" ${l.visible !== false ? 'checked' : ''} aria-label="show">
      <input type="text" data-a="name" value="${esc(l.name)}" aria-label="layer name"><input type="color" data-a="color" value="${esc(l.color)}" aria-label="colour">
      <button class="mini" data-a="zoom" aria-label="zoom">⌖</button><button class="mini red" data-a="del" aria-label="delete">✕</button></div>
    <div class="lo">${esc(t('gOpacity'))} <input type="range" min="0" max="100" step="5" data-a="op" value="${l.opacity ?? 100}"><b data-op>${l.opacity ?? 100}%</b></div>
    <div class="lo" style="padding-top:0">${l.features.length} ${esc(t('gFeatures'))}${l.source === 'kml' ? ' · KML' : ''}</div>
    ${l.open ? `<div class="feats">${l.features.map(f => `<div class="fe" data-f="${f.id}"><input type="checkbox" data-a="fvis" ${f.visible !== false ? 'checked' : ''} aria-label="show"><span>${FICON[f.type]}</span>
      <input type="text" data-a="fname" value="${esc(f.name)}" aria-label="name"><button class="mini" data-a="finfo" aria-label="details">ⓘ</button><button class="mini red" data-a="fdel" aria-label="delete">✕</button></div>`).join('')}</div>` : ''}
  </div>`).join('');
}
(() => {
  const box = $('#gis-lyr-list');
  const ctx = e => { const ld = e.target.closest('[data-l]'); if (!ld) return []; const l = G.layers.find(x => x.id === ld.dataset.l); const fd = e.target.closest('[data-f]'); return [l, fd && l.features.find(x => x.id === fd.dataset.f), ld]; };
  box.addEventListener('input', e => {
    const a = e.target.dataset.a, [l, f, ld] = ctx(e); if (!l) return;
    if (a === 'op') { l.opacity = +e.target.value; ld.querySelector('[data-op]').textContent = l.opacity + '%'; renderLayer(l); }
    else if (a === 'color') { l.color = e.target.value; l.keepOwn = false; renderLayer(l); }
    else if (a === 'name') l.name = e.target.value;
    else if (a === 'fname' && f) { f.name = e.target.value; renderLayer(l); }
    saveGis();
  });
  box.addEventListener('change', e => {
    const a = e.target.dataset.a, [l, f] = ctx(e); if (!l) return;
    if (a === 'vis') { l.visible = e.target.checked; renderLayer(l); saveGis(); }
    if (a === 'fvis' && f) { f.visible = e.target.checked; renderLayer(l); saveGis(); }
  });
  box.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a, [l, f] = ctx(e); if (!l) return;
    if (a === 'open') { l.open = !l.open; renderLayers(); saveGis(); }
    else if (a === 'zoom') { closeLayers(); zoomTo(gisBounds([Object.assign({}, l, { visible: true })])); }
    else if (a === 'del' && await ask(t('gDelLayer') + ' “' + l.name + '”')) { if (G.groups[l.id] && G.map) G.map.removeLayer(G.groups[l.id]); G.layers = G.layers.filter(x => x !== l); renderLayers(); saveGis(); }
    else if (a === 'finfo' && f) { closeLayers(); featInfo(l, f); }
    else if (a === 'fdel' && f && await ask(t('gDelFeat') + ' “' + f.name + '”')) { l.features = l.features.filter(x => x !== f); renderLayer(l); renderLayers(); saveGis(); }
  });
})();

/* ---- Export (drop-down menu) ---- */
function toggleExport() { const m = $('#gis-exp'); if (!m.classList.contains('hide')) return m.classList.add('hide'); renderExport(); m.classList.remove('hide'); }
function renderExport() {
  const opts = [['all', t('gExpAll')], ['visible', t('gExpVisible')], ...G.layers.map(l => [l.id, `${l.name} (${l.features.length})`])];
  if (!opts.some(o => o[0] === G.pick)) G.pick = 'all';
  $('#gis-exp').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">${esc(t('gExport'))}</b><button class="mini" onclick="$('#gis-exp').classList.add('hide')">✕</button></div>
    <label style="margin-top:10px">${esc(t('gFormat'))}</label><span class="pill"><button data-fmt="kml" class="${G.fmt === 'kml' ? 'on' : ''}">KML</button><button data-fmt="geojson" class="${G.fmt === 'geojson' ? 'on' : ''}">GeoJSON</button></span>
    <label style="margin-top:12px">${esc(t('gWhat'))}</label>
    ${opts.map(([v, lab]) => `<label class="exp-it"><input type="radio" name="gx" value="${esc(v)}" ${G.pick === v ? 'checked' : ''}> ${esc(lab)}</label>`).join('')}
    <div class="row"><button class="btn ghost sm" onclick="doExport('phone')">⬇ ${esc(t('gToPhone'))}</button><button class="btn sm" onclick="doExport('drive')">☁ ${esc(t('gToDrive'))}</button></div>`;
  $$('#gis-exp [data-fmt]').forEach(b => b.onclick = () => { G.fmt = b.dataset.fmt; renderExport(); });
  $$('#gis-exp input[name=gx]').forEach(r => r.onchange = () => { G.pick = r.value; });
}
function exportLayers() {
  if (G.pick === 'all') return G.layers;
  if (G.pick === 'visible') return G.layers.filter(l => l.visible !== false).map(l => Object.assign({}, l, { features: l.features.filter(f => f.visible !== false) }));
  return G.layers.filter(l => l.id === G.pick);
}
function kmlColor(hex, op) { const a = Math.round(Math.max(0, Math.min(1, op)) * 255).toString(16).padStart(2, '0'); return a + hex.slice(5, 7) + hex.slice(3, 5) + hex.slice(1, 3); }
function toKml(ls, title) {
  const crd = c => c.map(p => `${p[1]},${p[0]},${p[2] ?? 0}`).join(' ');
  const sty = (c, op) => `<LineStyle><color>${kmlColor(c, op)}</color><width>3</width></LineStyle><PolyStyle><color>${kmlColor(c, .35 * op)}</color></PolyStyle><IconStyle><color>${kmlColor(c, op)}</color><Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-blank.png</href></Icon></IconStyle>`;
  const pm = (l, f) => {
    const op = (l.opacity ?? 100) / 100;
    const st = l.keepOwn && f.color ? `<Style>${sty(f.color, op)}</Style>` : `<styleUrl>#s_${l.id}</styleUrl>`;
    let g, ext = '';
    if (f.type === 'Point') g = `<Point><coordinates>${crd(f.coords)}</coordinates></Point>`;
    else if (f.type === 'LineString') { g = `<LineString><tessellate>1</tessellate><coordinates>${crd(f.coords)}</coordinates></LineString>`; ext = `<ExtendedData><Data name="Length_m"><value>${lineLen(f.coords).toFixed(1)}</value></Data></ExtendedData>`; }
    else { g = `<Polygon><tessellate>1</tessellate><outerBoundaryIs><LinearRing><coordinates>${crd([...f.rings[0], f.rings[0][0]])}</coordinates></LinearRing></outerBoundaryIs>${f.rings.slice(1).map(r => `<innerBoundaryIs><LinearRing><coordinates>${crd([...r, r[0]])}</coordinates></LinearRing></innerBoundaryIs>`).join('')}</Polygon>`;
      ext = `<ExtendedData><Data name="Area_ha"><value>${(polyArea(f) / 10000).toFixed(4)}</value></Data></ExtendedData>`; }
    return `<Placemark><name>${esc(f.name)}</name><visibility>${f.visible === false || l.visible === false ? 0 : 1}</visibility>${st}${ext}${g}</Placemark>`;
  };
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(title)}</name>
${ls.map(l => `<Style id="s_${l.id}">${sty(l.color, (l.opacity ?? 100) / 100)}</Style>`).join('\n')}
${ls.map(l => `<Folder><name>${esc(l.name)}</name><visibility>${l.visible === false ? 0 : 1}</visibility>${l.features.map(f => pm(l, f)).join('')}</Folder>`).join('\n')}
</Document></kml>`;
}
function toGeoJSON(ls) {
  const ll = p => p[2] != null ? [p[1], p[0], p[2]] : [p[1], p[0]];
  return { type: 'FeatureCollection', features: ls.flatMap(l => l.features.map(f => {
    const op = (l.opacity ?? 100) / 100, c = (l.keepOwn && f.color) || l.color;
    const props = { name: f.name, layer: l.name, stroke: c, 'stroke-opacity': op, fill: c, 'fill-opacity': +(0.35 * op).toFixed(2), visible: f.visible !== false && l.visible !== false };
    if (f.type === 'LineString') props.length_m = +lineLen(f.coords).toFixed(1);
    if (f.type === 'Polygon') props.area_ha = +(polyArea(f) / 10000).toFixed(4);
    const geometry = f.type === 'Point' ? { type: 'Point', coordinates: ll(f.coords[0]) } : f.type === 'LineString' ? { type: 'LineString', coordinates: f.coords.map(ll) } : { type: 'Polygon', coordinates: f.rings.map(r => [...r, r[0]].map(ll)) };
    return { type: 'Feature', properties: props, geometry };
  })) };
}
async function doExport(dest) {
  const ls = exportLayers().filter(l => l.features.length); if (!ls.length) return toast(t('gNothing'));
  const title = G.pick === 'all' ? 'All layers' : G.pick === 'visible' ? 'Visible layers' : ls[0].name;
  const content = G.fmt === 'kml' ? toKml(ls, title) : JSON.stringify(toGeoJSON(ls), null, 1);
  $('#gis-exp').classList.add('hide');
  if (dest === 'phone') return saveFile(`${title}_${isoDay(new Date())}`.replace(/[^\wऀ-ॿ-]+/g, '_') + (G.fmt === 'kml' ? '.kml' : '.geojson'), content, G.fmt === 'kml' ? 'application/vnd.google-earth.kml+xml' : 'application/geo+json');
  const all = ls.flatMap(l => l.features);
  const u = user(), rec = baseRecord('gis', { range: u.range || '', circle: u.circle || '', beat: u.beat || '' });
  Object.assign(rec, { title, format: G.fmt, content, layers: ls.map(l => l.name).join(', '), features: all.length,
    lengthKm: +(all.filter(f => f.type === 'LineString').reduce((a, f) => a + lineLen(f.coords), 0) / 1000).toFixed(3),
    areaHa: +(all.filter(f => f.type === 'Polygon').reduce((a, f) => a + polyArea(f), 0) / 10000).toFixed(3) });
  await enqueue(rec, `GIS — ${title} (${G.fmt.toUpperCase()})`);
}

/* ---------------- SETTINGS ---------------- */
function openSettings() { show('s-settings'); }
async function renderSettings() {
  const n = await idb.count('outbox');
  $('#st-pend').textContent = n ? `⬆ ${n} ${t('pending')}` : t('allSynced');
  const log = (await idb.all('log')).sort((a, b) => b.at - a.at).slice(0, 40);
  $('#st-log').innerHTML = log.length ? log.map(l => `<div class="it"><div>${esc(l.title)}<small>${fmtDT(new Date(l.at))}${l.err ? ' • ' + esc(l.err) : ''}</small></div><span class="st ${l.status === 'ok' ? 'ok' : l.status === 'err' ? 'err' : ''}">${l.status === 'ok' ? '✓ Drive' : l.status === 'err' ? '!' : '⬆'}</span></div>`).join('') : `<p class="muted">${esc(t('none'))}</p>`;
  $('#st-api').value = LS.get('api', '') || CONFIG.API_URL;
  $('#st-ver').textContent = `${CONFIG.APP} v${CONFIG.VERSION}`;
}
ONSHOW['s-settings'] = renderSettings; RERENDER['s-settings'] = renderSettings;
function saveApi() { const v = $('#st-api').value.trim(); if (v && !/^https:\/\/script\.google(usercontent)?\.com\//.test(v)) return toast('URL should start with https://script.google.com/'); LS.set('api', v); toast(t('apiSaved')); }
async function logout() {
  const n = await idb.count('outbox'); if (n && !(await ask(t('confirmLogout')))) return;
  if (session && session.token !== 'demo' && apiUrl()) api('logout', { token: session.token }).catch(() => {});

}

try { if (!window.VP_PREVIEW && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
applyI18n();
(async () => {

    const ap = await idb.get('kv', 'activePatrol');

})();
